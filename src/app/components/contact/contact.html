<section id="contacto" class="section reveal">
    <p class="periodico">
        <span class="letra simple">C</span><span class="letra puntos">o</span><span class="letra papel">n</span><span
            class="letra sombra">t</span><span class="letra lineas">a</span><span class="letra color">c</span><span
            class="letra simpleDos">t</span><span class="letra simple">o</span>
    </p>

    <div class="contact-section">
        <div class="contact-image">
            <img src="assets/contact.png" alt="Ariadna Foto">
        </div>

        <div class="contact-form-container">
            <h3>¿Hablamos?</h3>
            <p>Estoy abierta a nuevas oportunidades y colaboraciones.</p>

            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <input type="text" id="name" name="name" placeholder="Nombre" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="Correo" required>
                </div>
                <div class="form-group">
                    <textarea id="message" name="message" placeholder="Indica tu mensaje aquí :o" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn-primary">Enviar Mensaje</button>
            </form>
        </div>
    </div>
</section>
